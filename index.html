<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GymLog</title>
  <meta name="description" content="Seguimiento de constancia, rutinas e informes semanales del gimnasio.">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymLog">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">GymLog</h1>
    <button class="icon-btn" data-act="go" data-tab="settings" aria-label="Ajustes">⚙︎</button>
  </header>
  <main id="view"></main>
  <div id="rest" class="rest hidden" data-act="restStop"></div>
  <nav class="tabbar">
    <button data-act="go" data-tab="home"><span>◉</span>Actividad</button>
    <button data-act="go" data-tab="routines"><span><svg viewBox="0 0 24 24" class="st" aria-hidden="true"><circle cx="15.5" cy="3.8" r="2.3" class="f"/><path d="M13.2 8.2 10.6 13.8M13.2 8.2 9.2 9.6 7.2 12.2M13.2 8.2 15.6 11.2 18.8 11.6M10.6 13.8 7.4 16.8H3.8M10.6 13.8 14.2 16.2 13.2 21.2"/></svg></span>Rutinas</button>
    <button data-act="go" data-tab="train" class="primary-tab"><span><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(45 12 12) translate(12 12) scale(.92) translate(-12 -12)"><rect x="1.5" y="9" width="2.5" height="6" rx="1"/><rect x="4" y="6" width="4" height="12" rx="1.3"/><rect x="8" y="11" width="8" height="2"/><rect x="16" y="6" width="4" height="12" rx="1.3"/><rect x="20" y="9" width="2.5" height="6" rx="1"/></g></svg></span>Entrenar</button>
    <button data-act="go" data-tab="history"><span>◷</span>Historial</button>
    <button data-act="go" data-tab="progress"><span><svg viewBox="0 0 24 24" class="st" aria-hidden="true"><path d="M3 15.5 8.5 9.5 12.5 13.5 20.5 5.5"/><path d="M3 20.5H21"/></svg></span>Progreso</button>
    <button data-act="go" data-tab="report"><span>⇪</span>Informe</button>
  </nav>
  <datalist id="exnames"></datalist>
  <script src="app.js"></script>
</body>
</html>
