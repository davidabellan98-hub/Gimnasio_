<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GymLog</title>
  <meta name="description" content="Seguimiento de constancia, rutinas e informes semanales del gimnasio.">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymLog">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">GymLog</h1>
    <button class="icon-btn" data-act="go" data-tab="settings" aria-label="Ajustes">⚙︎</button>
  </header>
  <main id="view"></main>
  <div id="rest" class="rest hidden" data-act="restStop"></div>
  <nav class="tabbar">
    <button data-act="go" data-tab="home"><span>◉</span>Resumen</button>
    <button data-act="go" data-tab="routines"><span>☰</span>Rutinas</button>
    <button data-act="go" data-tab="train" class="primary-tab"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="9" width="2.5" height="6" rx="1"/><rect x="4" y="6" width="4" height="12" rx="1.3"/><rect x="8" y="11" width="8" height="2"/><rect x="16" y="6" width="4" height="12" rx="1.3"/><rect x="20" y="9" width="2.5" height="6" rx="1"/></svg></span>Entrenar</button>
    <button data-act="go" data-tab="history"><span>◷</span>Historial</button>
    <button data-act="go" data-tab="progress"><span>↗</span>Progreso</button>
    <button data-act="go" data-tab="report"><span>⇪</span>Informe</button>
  </nav>
  <datalist id="exnames"></datalist>
  <script src="app.js"></script>
</body>
</html>
